<html>
    
            <body>

                         <label for="Mobile No">Mobile No:</label>

                  <script>
                        function validatename(name){
                              if(name==null||name== ""){
                                    alert("Name can't be blank");
                                    return false;
                              }
                              if(name.length<3){
                                    alert("Name must be atleast 3characters long");
                                    return false;}
                                    return true;
                              }
                        
                              function validateform(){
                                    var name=document.getElementById("name").value.trim();
                                    var mobile=document.getElementById("Mobile No").value.trim();      
                              var email=document.getElementById("email").value.trim();
                        if(!validatename(name)){
                              return false;
                        }                  if(mobile==null||mobile==""){
                              alert("mobile number can't be blank");

                        }    
                  if(mobile.length!==10){
                        alert("mobile number musdt be exactly 10 digits long");
                        return false;}
                  for(var i=0;i<mobile.length;i++){
                        if(mobile[i]<'0'||mobile[i]>'9'){
                              alert("Mobile number must cotain digits only");
                              return false;
                        }
                                    } 
                              }
                              
                                                                                                                                                                 
                              var reg=new RegExp("^[a-zA-Z0-9_]+@[a-zA-Z0-9]+$");
                              if(!reg.test(email)){
                                    alert("Invalid e-mail Address");
                                    return false;
                              }
                             

                        </script>
